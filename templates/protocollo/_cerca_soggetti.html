{% for s in risultati %}
<button type="button" class="list-group-item list-group-item-action d-flex align-items-center" hx-get="{% url 'protocollo:scelta_soggetto' %}?campo={{ campo }}&amp;id={{ s.pk }}" hx-target="#scelti-{{ campo }}" hx-swap="beforeend">
  <i class="ti ti-{% if s.is_persona %}user{% else %}building{% endif %} me-2 text-secondary"></i>
  <span class="flex-fill text-start">{{ s.nome_completo }}{% if s.qualifica %} <span class="text-secondary small">· {{ s.qualifica }}</span>{% endif %}</span>
  <span class="small text-secondary">{{ s.pec|default:s.email|default:s.comune }}</span>
  <i class="ti ti-plus ms-2"></i>
</button>
{% empty %}{% if request.GET %}<div class="list-group-item text-secondary small">Nessun risultato: scrivere il corrispondente nel riquadro sotto.</div>{% endif %}{% endfor %}
