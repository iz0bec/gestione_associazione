{% extends "base.html" %}
{% block titolo %}Sezione{% endblock %}
{% block sopratitolo %}<div class="page-pretitle"><a href="{% url 'soci:sezioni' %}">Sezioni</a></div>{% endblock %}
{% block titolo_pagina %}{% if object %}{{ object }}{% else %}Nuova sezione{% endif %}{% endblock %}
{% block contenuto %}
<form method="post" class="card" novalidate>{% csrf_token %}
  <div class="card-body">{{ form }}</div>
  <div class="card-footer d-flex"><a class="btn btn-link" href="{% url 'soci:sezioni' %}">Annulla</a><button class="btn btn-primary ms-auto" type="submit"><i class="ti ti-device-floppy me-1"></i>Salva</button></div>
</form>
{% endblock %}
