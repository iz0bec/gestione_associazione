{% load allauth %}
<section class="card mb-3">
  <div class="card-header"><h2 class="card-title">{% slot title %}{% endslot %}</h2></div>
  <div class="card-body">{% slot body %}{% endslot %}</div>
  {% if slots.actions %}<div class="card-footer d-flex gap-2">{% for a in slots.actions %}{{ a }}{% endfor %}</div>{% endif %}
</section>
