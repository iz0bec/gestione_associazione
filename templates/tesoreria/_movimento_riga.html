<a class="list-group-item list-group-item-action d-flex align-items-center{% if m.annullato %} text-secondary{% endif %}" href="{{ m.get_absolute_url }}">
  <span class="avatar avatar-sm me-3 {% if m.tipo == 'entrata' %}bg-green-lt{% elif m.tipo == 'uscita' %}bg-red-lt{% else %}bg-blue-lt{% endif %}"><i class="ti ti-{% if m.tipo == 'entrata' %}arrow-down-left{% elif m.tipo == 'uscita' %}arrow-up-right{% else %}arrows-exchange{% endif %}"></i></span>
  <span class="flex-fill text-truncate"><span class="{% if m.annullato %}text-decoration-line-through{% endif %}">{{ m.descrizione }}</span><span class="d-block small text-secondary">{{ m.data|date:"d/m/Y" }} · {{ m.conto }}{% if m.conto_destinazione %} → {{ m.conto_destinazione }}{% endif %}</span></span>
  <span class="text-nowrap ms-2 {% if m.tipo == 'entrata' %}text-green{% elif m.tipo == 'uscita' %}text-red{% endif %}">{% if m.tipo == 'uscita' %}−{% endif %}{{ m.importo|floatformat:"2g" }} €</span>
</a>
