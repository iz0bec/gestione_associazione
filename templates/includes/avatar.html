{% comment %}Avatar di un soggetto: foto se presente, altrimenti iniziali o icona. Parametri: s, classe.{% endcomment %}<span class="avatar {{ classe|default:'avatar-sm' }} {% if s.is_persona %}bg-blue-lt{% else %}bg-green-lt{% endif %}">{% if s.foto %}<img src="{% url 'anagrafica:foto' s.pk %}?v={{ s.modificato_il|date:'U' }}" alt="" loading="lazy">{% elif s.is_persona %}{{ s.iniziali }}{% else %}<i class="ti ti-building"></i>{% endif %}</span>
