{% extends "base.html" %}
{% block titolo %}{{ titolo }}{% endblock %}
{% block sopratitolo %}<div class="page-pretitle"><a href="{{ indietro }}">Patrimonio</a></div>{% endblock %}
{% block titolo_pagina %}{{ object|default:titolo }}{% endblock %}
{% block contenuto %}
<form method="post" class="card" novalidate>{% csrf_token %}
  <div class="card-body">{{ form }}</div>
  <div class="card-footer d-flex"><a class="btn btn-link" href="{{ indietro }}">Annulla</a><button class="btn btn-primary ms-auto" type="submit"><i class="ti ti-device-floppy me-1"></i>Salva</button></div>
</form>
{% endblock %}
