openapi: 3.1.0
info:
  title: Gestione Associazione - API di interoperabilità
  version: 1.0.0-f3
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
  summary: Contratto pubblico per installazioni pari e per adattatori esterni.
  description: |
    **Approvato (ADR-030).** Implementati: F1 `/.well-known/…`, `/abbinamenti`, `/prova`,
    `/chiavi`; F2 `/cambiamenti`, `/riepiloghi/{flusso}`, `/eventi` (lettura), `/sezioni`; F3
    cifratura, adesioni, `/domande`, `/contatti`, `/documenti`, `/organigramma`, `/tessere/{codice}`.
    `/soci`, `/lotti` e `/consegne` arrivano con le fasi successive.

    **Ambiti**: `eventi:lettura`, `adesioni:lettura`, `adesioni:scrittura`, `sezioni:lettura`,
    `domande:scrittura`, `contatti:scrittura`, `documenti:lettura`, `organigramma:lettura`,
    `tessere:verifica` (e, dalle fasi successive, `soci:lettura`, `lotti:lettura`,
    `consegne:scrittura`). Li concede l'amministratore per ogni controparte. Il contratto è pubblico: gli adattatori verso altri sistemi
    (WordPress, app, gestionali) non fanno parte del progetto e si scrivono su questo documento.

    ## Sicurezza (obbligatoria per ogni chiamata tranne `/.well-known/…`)

    - **Firma** di richieste e risposte con HTTP Message Signatures (RFC 9421), algoritmo `ed25519`,
      etichetta `ga`, `tag="ga-v1"`. Componenti della richiesta: `"@method" "@path" "@query"
      "destinatario-istanza"` più `"content-digest"` quando c'è un corpo. Parametri: `created`,
      `expires`, `nonce`, `keyid`, `alg`. La risposta firma `"@status" "content-digest"
      "signature";req;key="ga"`.
    - **Destinatario-Istanza**: UUID dell'istanza a cui è diretta la richiesta (firmato). L'autorità
      (host) non è firmata: la stessa istanza si raggiunge per nome pubblico o indirizzo interno.
    - **Content-Digest** (RFC 9530) `sha-256` su ogni corpo.
    - **Cifratura**: i corpi con dati personali sono JWE compatti (`application/jose`,
      `alg=ECDH-ES+A256KW`, `enc=A256GCM`, chiave X25519 del destinatario, `cty=application/json`).
      Gli schemi qui sotto descrivono il JSON **dopo** la decifratura.
    - Tolleranza dell'orologio ±300 s; nonce non riutilizzabili.
    - **Rotazione delle chiavi**: ogni risposta è firmata con la chiave in uso (etichetta `ga`) e con
      quelle in uscita ancora valide (`ga1`, `ga2`, …). Chi conosce solo una chiave precedente
      verifica con la sua etichetta e accetta la nuova JWKS. Una controparte presenta le proprie
      chiavi nuove con `PUT /chiavi`, firmata con una chiave già nota.

    ## Affidabilità

    - Ogni cambiamento è un CloudEvent in un **flusso** con progressivo senza buchi e catena di
      impronte SHA-256. Chi legge salva il cursore insieme ai dati applicati.
    - **Prima sincronizzazione**: si legge `ultimo` (o `progressivo` del riepilogo), poi l'elenco
      completo della risorsa, poi il feed da quel progressivo. Le voci viste due volte si
      riconoscono dalla `versione`. Una risorsa che risponde 404 non è (più) visibile alla
      controparte e va tolta dalla propria copia.
    - **Notifiche** (facoltative): a ogni cambiamento dei flussi sottoscritti si invia il CloudEvent
      con `POST` all'indirizzo delle notifiche della controparte (`application/cloudevents+json`),
      firmato come le richieste, con `Destinatario-Istanza` = UUID della controparte. Rispondere
      `2xx`. Sono solo un avviso, ripetuto con attesa crescente fino a 24 ore: la lettura periodica
      del feed resta la fonte.
    - Le scritture (`POST`) richiedono `Idempotency-Key` (8-64 caratteri `A-Za-z0-9._:-`), conservata
      30 giorni: la ripetizione con lo stesso contenuto (anche cifrato di nuovo) restituisce la
      risposta originale con `Idempotent-Replayed: true`; un contenuto diverso dà
      `422 idempotenza-conflitto`.
    - Limiti per controparte: chiamate al minuto e scritture all'ora (predefiniti 120); oltre si
      riceve `429 troppe-richieste` con `Retry-After`.
    - I dati personali **in ingresso** devono essere cifrati: un corpo in chiaro dà
      `415 cifratura-richiesta`; un JWE illeggibile `400 decifratura-fallita`.
    - Errori in formato Problem Details (RFC 9457).
  contact:
    name: Gestione Associazione
    url: https://github.com/iz0bec/gestione_associazione

servers:
  - url: https://{host}/api/v1
    description: Indirizzo pubblico (solo HTTPS).
    variables:
      host:
        default: gestionale.example.org
  - url: https://{indirizzo}/api/v1
    description: |
      Rete interna (stesso host o LAN) in HTTPS, la modalità preferita. Certificato verificato con la
      CA di sistema, con la CA interna dell'organizzazione o con l'impronta SPKI scambiata
      all'abbinamento (anche autofirmato). La verifica non si disattiva mai.
    variables:
      indirizzo:
        default: gestionale.example.lan:8443
  - url: http://{indirizzo}/api/v1
    description: |
      Eccezione per la rete interna: solo indirizzi privati o locali, controparte segnata «rete
      interna» e trasporto in chiaro abilitato esplicitamente. Firma e cifratura restano obbligatorie.
    variables:
      indirizzo:
        default: 192.168.0.34:8003

security:
  - firmaHttp: []

tags:
  - name: istanza
    description: Identità, chiavi e verifica del collegamento.
  - name: abbinamento
    description: Collegamento iniziale fra due parti tramite invito monouso.
  - name: cambiamenti
    description: Feed dei cambiamenti, riepiloghi e modalità a spinta.
  - name: eventi
  - name: adesioni
  - name: sezioni
  - name: soci
  - name: lotti
  - name: domande

paths:
  /.well-known/gestione-associazione:
    servers:
      - url: https://{host}
        variables:
          host:
            default: gestionale.example.org
    get:
      tags: [istanza]
      operationId: descriviIstanza
      summary: Identità pubblica dell'istanza e versioni supportate
      security: []
      responses:
        "200":
          description: Descrizione dell'istanza (firmata con la chiave dell'istanza).
          headers:
            Signature: { $ref: "#/components/headers/Signature" }
            Signature-Input: { $ref: "#/components/headers/SignatureInput" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Istanza" }

  /.well-known/gestione-associazione/jwks.json:
    servers:
      - url: https://{host}
        variables:
          host:
            default: gestionale.example.org
    get:
      tags: [istanza]
      operationId: chiaviIstanza
      summary: Chiavi pubbliche dell'istanza (JWKS)
      security: []
      responses:
        "200":
          description: Chiavi Ed25519 (firma) e X25519 (cifratura), comprese quelle in rotazione.
          content:
            application/jwk-set+json:
              schema: { $ref: "#/components/schemas/Jwks" }

  /abbinamenti:
    post:
      tags: [abbinamento]
      operationId: abbina
      summary: Presenta le proprie chiavi usando un invito monouso
      description: |
        Unica chiamata autenticata dall'invito invece che dalla firma di una controparte nota.
        La richiesta è comunque firmata con la chiave presentata nel corpo (prova di possesso).
        La controparte nasce `in_prova` finché l'amministratore non conferma l'impronta.
      security:
        - invito: []
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RichiestaAbbinamento" }
      responses:
        "201":
          description: Abbinamento registrato, in attesa di conferma dell'impronta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EsitoAbbinamento" }
        "400": { $ref: "#/components/responses/Problema" }
        "401": { $ref: "#/components/responses/Problema" }
        "409": { $ref: "#/components/responses/Problema" }
        "410":
          description: Invito scaduto o già usato.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /prova:
    post:
      tags: [istanza]
      operationId: prova
      summary: Verifica firma, orologio, cifratura e ambiti, con diagnosi
      description: |
        Disponibile anche alle controparti `in_prova`. Non modifica nulla. Se il corpo è un JWE,
        restituisce l'esito della decifratura e un JWE cifrato per il chiamante.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
          application/jose:
            schema: { $ref: "#/components/schemas/Jwe" }
      responses:
        "200":
          description: Diagnosi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnosi" }
        "401": { $ref: "#/components/responses/Problema" }
        "403": { $ref: "#/components/responses/Problema" }
        "421": { $ref: "#/components/responses/Problema" }

  /chiavi:
    put:
      tags: [istanza]
      operationId: aggiornaChiavi
      summary: Presenta chiavi nuove (rotazione)
      description: |
        Firmata con una chiave già nota. Sostituisce la JWKS della controparte (stesse regole
        dell'abbinamento: `kid` = impronta RFC 7638). Disponibile anche alle controparti in prova.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jwks]
              properties:
                jwks: { $ref: "#/components/schemas/Jwks" }
      responses:
        "200":
          description: Chiavi registrate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwks: { $ref: "#/components/schemas/Jwks" }
        "400": { $ref: "#/components/responses/Problema" }
        "401": { $ref: "#/components/responses/Problema" }

  /cambiamenti:
    get:
      tags: [cambiamenti]
      operationId: elencaCambiamenti
      summary: Cambiamenti di un flusso dopo un progressivo
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: flusso
          in: query
          required: true
          description: |
            `eventi` (ambito `eventi:lettura`), `sezioni` (`sezioni:lettura`); con le fasi
            successive `soci:<codice sezione>`, `lotti:<codice sezione>`. Un flusso sconosciuto
            risponde 404.
          schema: { type: string, examples: ["soci:PZ001"] }
        - name: dopo
          in: query
          required: false
          description: Ultimo progressivo già applicato (0 = dall'inizio conservato).
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          description: Pagina di cambiamenti in ordine di progressivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaCambiamenti" }
        "403": { $ref: "#/components/responses/Problema" }
        "410":
          description: Il cursore è più vecchio della conservazione; serve una risincronizzazione.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /riepiloghi/{flusso}:
    get:
      tags: [cambiamenti]
      operationId: riepilogoFlusso
      summary: Impronta riassuntiva per la riconciliazione
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: flusso
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            Numero di risorse visibili alla controparte e impronta: SHA-256 (hex) delle righe
            `uuid:versione` ordinate, unite da "\n".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Riepilogo" }

  /consegne:
    post:
      tags: [cambiamenti]
      operationId: consegna
      summary: Modalità a spinta (mittente non raggiungibile)
      description: |
        Ambito `consegne:scrittura`. Il mittente invia i propri cambiamenti, in ordine e senza buchi,
        con le risorse. Il destinatario memorizza e applica con le regole dell'importazione; risponde
        con l'ultimo progressivo accettato. Ripetere una consegna già accettata non ha effetti.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/jose:
            schema: { $ref: "#/components/schemas/Jwe" }
            x-contenuto-decifrato: { $ref: "#/components/schemas/Consegna" }
      responses:
        "200":
          description: Consegna accettata (anche parzialmente).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EsitoConsegna" }
        "409":
          description: Buco o catena di impronte non coerente; il mittente riparte da `atteso`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /eventi:
    get:
      tags: [eventi]
      operationId: elencaEventi
      summary: Eventi visibili alla controparte
      description: Ambito `eventi:lettura`. Alle integrazioni solo gli eventi con modulo pubblico.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: dal
          in: query
          description: Solo eventi che iniziano da questa data.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Cursore"
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          description: Pagina di eventi.
          content:
            application/json:
              schema:
                type: object
                required: [risultati, successivo]
                properties:
                  risultati:
                    type: array
                    items: { $ref: "#/components/schemas/Evento" }
                  successivo: { $ref: "#/components/schemas/CursoreSuccessivo" }

  /eventi/{uuid}:
    get:
      tags: [eventi]
      operationId: leggiEvento
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: Evento.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evento" }
        "404": { $ref: "#/components/responses/Problema" }

  /eventi/{uuid}/adesioni:
    get:
      tags: [adesioni]
      operationId: elencaAdesioni
      summary: Adesioni registrate da questa controparte (dati personali, cifrati)
      description: Ambito `adesioni:lettura`. Un'integrazione vede solo le adesioni che ha inviato.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: Elenco cifrato.
          content:
            application/jose:
              schema: { $ref: "#/components/schemas/Jwe" }
              x-contenuto-decifrato:
                type: array
                items: { $ref: "#/components/schemas/Adesione" }
    post:
      tags: [adesioni]
      operationId: aderisci
      summary: Registra un'adesione (stesse regole del modulo pubblico)
      description: Ambito `adesioni:scrittura`.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/Uuid"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/jose:
            schema: { $ref: "#/components/schemas/Jwe" }
            x-contenuto-decifrato: { $ref: "#/components/schemas/NuovaAdesione" }
      responses:
        "201":
          description: Adesione registrata.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/jose:
              schema: { $ref: "#/components/schemas/Jwe" }
              x-contenuto-decifrato: { $ref: "#/components/schemas/Adesione" }
        "409":
          description: Evento annullato, adesioni chiuse o posti esauriti (messaggio per l'utente).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "422": { $ref: "#/components/responses/Problema" }

  /adesioni/{uuid}:
    delete:
      tags: [adesioni]
      operationId: annullaAdesione
      summary: Annulla un'adesione inviata da questa controparte
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/Uuid"
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      responses:
        "204": { description: Annullata. }
        "412": { $ref: "#/components/responses/Problema" }

  /sezioni:
    get:
      tags: [sezioni]
      operationId: elencaSezioni
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
      responses:
        "200":
          description: Sezioni visibili alla controparte.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sezione" }

  /soci:
    get:
      tags: [soci]
      operationId: elencaSoci
      summary: Soci di una sezione con le tessere (cifrato)
      description: Ambito `soci:lettura`, solo per le sezioni assegnate alla controparte.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: sezione
          in: query
          required: true
          schema: { type: string, description: Codice della sezione. }
        - $ref: "#/components/parameters/Cursore"
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          description: Pagina cifrata.
          content:
            application/jose:
              schema: { $ref: "#/components/schemas/Jwe" }
              x-contenuto-decifrato:
                type: object
                required: [risultati, successivo]
                properties:
                  risultati:
                    type: array
                    items: { $ref: "#/components/schemas/Socio" }
                  successivo: { $ref: "#/components/schemas/CursoreSuccessivo" }

  /soci/{uuid}:
    get:
      tags: [soci]
      operationId: leggiSocio
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: Socio (cifrato).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/jose:
              schema: { $ref: "#/components/schemas/Jwe" }
              x-contenuto-decifrato: { $ref: "#/components/schemas/Socio" }

  /lotti:
    get:
      tags: [lotti]
      operationId: elencaLotti
      summary: Lotti di tessere fisiche (dato della federazione)
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: sezione
          in: query
          required: true
          schema: { type: string }
        - name: anno
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Lotti con lo stato delle carte.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lotto" }

  /domande:
    post:
      tags: [domande]
      operationId: presentaDomanda
      summary: Domanda di iscrizione (resta in attesa, mai accolta in automatico)
      description: Ambito `domande:scrittura`. Stessi campi e consensi obbligatori del modulo pubblico.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/jose:
            schema: { $ref: "#/components/schemas/Jwe" }
            x-contenuto-decifrato: { $ref: "#/components/schemas/NuovaDomanda" }
      responses:
        "201":
          description: Domanda registrata.
          content:
            application/json:
              schema:
                type: object
                required: [uuid, stato]
                properties:
                  uuid: { type: string, format: uuid }
                  stato: { const: in_attesa }
        "422": { $ref: "#/components/responses/Problema" }

  /contatti:
    post:
      tags: [contatti]
      operationId: inviaContatto
      summary: Messaggio del modulo contatti (arriva tra la posta da protocollare)
      description: Ambito `contatti:scrittura`. Corpo cifrato.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/jose:
            schema: { $ref: "#/components/schemas/Jwe" }
            x-contenuto-decifrato:
              type: object
              required: [nome, email, testo]
              properties:
                nome: { type: string, maxLength: 200 }
                email: { type: string, format: email }
                telefono: { type: string, maxLength: 30 }
                oggetto: { type: string, maxLength: 200 }
                testo: { type: string, maxLength: 10000 }
                riferimento_esterno: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Messaggio ricevuto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ricevuto: { const: true }
                  riferimento: { type: string, description: Message-ID assegnato. }
        "415": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }

  /documenti:
    get:
      tags: [pubblici]
      operationId: elencaDocumenti
      summary: Documenti pubblici (statuto, regolamenti, bilanci)
      description: Ambito `documenti:lettura`. Solo i documenti pubblicati.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
      responses:
        "200":
          description: Elenco.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    titolo: { type: string }
                    descrizione: { type: string }
                    nome_file: { type: string }
                    dimensione: { type: integer }
                    modificato_il: { type: string, format: date-time }
                    file: { type: string, description: Percorso del file nell'API. }
                    pagina_pubblica: { type: string, format: uri }

  /documenti/{id}/file:
    get:
      tags: [pubblici]
      operationId: scaricaDocumento
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Il documento.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problema" }

  /organigramma:
    get:
      tags: [pubblici]
      operationId: organigramma
      summary: Cariche in corso degli organi (assemblee escluse)
      description: Ambito `organigramma:lettura`. Solo ruolo e nome.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
      responses:
        "200":
          description: Organi con i componenti in carica.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    organo: { type: string }
                    tipo: { type: string }
                    sezione: { type: [string, "null"], description: Codice della sezione o null. }
                    componenti:
                      type: array
                      items:
                        type: object
                        properties:
                          ruolo: { type: string }
                          ruolo_descrizione: { type: string }
                          nome: { type: string }
                          dal: { type: [string, "null"], format: date }

  /tessere/{codice}:
    get:
      tags: [pubblici]
      operationId: verificaTessera
      summary: Verifica di una tessera dal codice della tessera digitale (QR)
      description: Ambito `tessere:verifica`. Nessun dato della persona.
      parameters:
        - $ref: "#/components/parameters/DestinatarioIstanza"
        - name: codice
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Esito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valida: { type: boolean }
                  motivo: { type: string }
                  anno: { type: integer }
                  sezione: { type: string }
        "404": { $ref: "#/components/responses/Problema" }

components:
  securitySchemes:
    firmaHttp:
      type: apiKey
      in: header
      name: Signature
      description: |
        HTTP Message Signatures (RFC 9421) con `Signature-Input`, chiave Ed25519 della controparte
        (`keyid` = `kid` della JWKS). Vedi la descrizione generale per i componenti firmati.
    invito:
      type: apiKey
      in: header
      name: Invito
      description: Codice d'invito monouso creato dall'amministratore (valido 24 ore).

  headers:
    Signature:
      description: Firma RFC 9421 della risposta.
      schema: { type: string }
    SignatureInput:
      description: Componenti e parametri della firma della risposta.
      schema: { type: string }
    ETag:
      description: Versione della risorsa (`"<versione>"`).
      schema: { type: string }

  parameters:
    DestinatarioIstanza:
      name: Destinatario-Istanza
      in: header
      required: true
      description: UUID dell'istanza destinataria; coperto dalla firma.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Valore unico per operazione (consigliato UUIDv4), conservato 30 giorni.
      schema: { type: string, maxLength: 64 }
    Uuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursore:
      name: cursore
      in: query
      description: Valore `successivo` della pagina precedente.
      schema: { type: string }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    Problema:
      description: Errore (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }

  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: "`urn:gestione-associazione:problema:<codice>`"
          examples: ["urn:gestione-associazione:problema:firma-non-valida"]
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Messaggio per l'utente, in italiano. }
        codice:
          type: string
          enum:
            - firma-non-valida
            - firma-scaduta
            - nonce-riusato
            - destinatario-errato
            - controparte-non-attiva
            - ip-non-ammesso
            - ambito-mancante
            - digest-errato
            - cifratura-richiesta
            - decifratura-fallita
            - idempotenza-conflitto
            - operazione-non-valida
            - cursore-scaduto
            - catena-interrotta
            - troppe-richieste
            - invito-non-valido
            - non-configurata
            - cifratura-richiesta

    Istanza:
      type: object
      required: [istanza, nome, versioni_api, jwks_uri]
      properties:
        istanza: { type: string, format: uuid }
        nome: { type: string, description: Denominazione dell'organizzazione. }
        versioni_api: { type: array, items: { type: string }, examples: [["v1"]] }
        jwks_uri: { type: string, format: uri }
        software_versione: { type: string, examples: ["1.0.36"] }
        tls_spki:
          type: array
          description: |
            Impronte SHA-256 (base64) delle chiavi pubbliche dei certificati TLS dell'istanza, per la
            verifica in modalità `impronta` in rete interna. Più valori durante un rinnovo.
          items: { type: string }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, use]
            properties:
              kty: { const: OKP }
              crv: { enum: [Ed25519, X25519] }
              x: { type: string, description: Chiave pubblica in base64url. }
              kid: { type: string, description: Impronta RFC 7638 della chiave (obbligatorio). }
              use: { enum: [sig, enc] }
              exp: { type: integer, description: Fine validità (Unix), per le chiavi in rotazione. }

    Jwe:
      type: string
      description: JWE compatto (`ECDH-ES+A256KW` / `A256GCM`, X25519) con contenuto JSON.
      pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"

    RichiestaAbbinamento:
      type: object
      required: [istanza, nome, tipo, jwks]
      properties:
        istanza: { type: string, format: uuid, description: UUID della controparte. }
        nome: { type: string }
        tipo: { enum: [installazione, integrazione] }
        jwks: { $ref: "#/components/schemas/Jwks" }
        indirizzo_notifiche: { type: string, format: uri }
        tls_spki:
          type: array
          description: Impronte SPKI dei certificati della controparte (rete interna, modalità `impronta`).
          items: { type: string }

    EsitoAbbinamento:
      type: object
      required: [istanza, stato, impronta, jwks]
      properties:
        istanza: { type: string, format: uuid }
        stato: { const: in_prova }
        impronta:
          type: string
          description: |
            Impronta dell'abbinamento, uguale per le due parti: SHA-256 delle impronte RFC 7638 di
            tutte le chiavi in uso di entrambe, ordinate e unite da "\n"; prime 32 cifre
            esadecimali maiuscole in gruppi di 4. Da confermare per una seconda via.
          examples: ["4F2A 91C3 0B7E 55D1 A2C8 6E40 9F13 7B2D"]
        jwks: { $ref: "#/components/schemas/Jwks" }

    Diagnosi:
      type: object
      required: [firma, orologio, controparte]
      properties:
        firma: { enum: [valida, non-valida, assente] }
        orologio: { type: object, properties: { scarto_secondi: { type: integer } } }
        controparte: { type: object, properties: { stato: { type: string }, ambiti: { type: array, items: { type: string } } } }
        cifratura: { enum: [valida, non-valida, assente] }
        risposta_cifrata: { $ref: "#/components/schemas/Jwe" }
        indirizzo_ip_visto: { type: string }
        istanza: { type: string, format: uuid, description: UUID dell'istanza che risponde. }

    Cambiamento:
      description: CloudEvent 1.0 (formato JSON). Non contiene dati personali.
      type: object
      required: [specversion, id, source, type, subject, time, ga_progressivo, ga_impronta, ga_precedente, data]
      properties:
        specversion: { const: "1.0" }
        id: { type: string, examples: ["soci:PZ001:1542"] }
        source: { type: string, examples: ["urn:uuid:7c1e2a9e-5d0b-4c71-9a43-0d2f7f6f3b11"] }
        type:
          type: string
          examples:
            - it.gestioneassociazione.socio.modificato.v1
            - it.gestioneassociazione.evento.annullato.v1
            - it.gestioneassociazione.socio.anonimizzato.v1
            - it.gestioneassociazione.sezione.creato.v1
        subject: { type: string, format: uuid, description: UUID della risorsa. }
        time: { type: string, format: date-time, description: UTC, al secondo (`…Z`). }
        datacontenttype: { const: application/json }
        ga_flusso: { type: string }
        ga_progressivo: { type: integer, minimum: 1 }
        ga_precedente:
          type: string
          description: Impronta della voce precedente (hex); 64 zeri per la prima voce del flusso.
        ga_impronta:
          type: string
          description: SHA-256(ga_precedente ‖ JSON canonico RFC 8785 dell'evento senza ga_impronta), hex.
        data:
          type: object
          required: [risorsa, versione]
          properties:
            risorsa: { enum: [evento, adesione, sezione, socio, lotto] }
            versione: { type: integer }

    PaginaCambiamenti:
      type: object
      required: [flusso, cambiamenti, ultimo]
      properties:
        flusso: { type: string }
        cambiamenti: { type: array, items: { $ref: "#/components/schemas/Cambiamento" } }
        ultimo: { type: integer, description: Ultimo progressivo esistente nel flusso. }

    Riepilogo:
      type: object
      required: [flusso, risorse, impronta, progressivo]
      properties:
        flusso: { type: string }
        risorse: { type: integer }
        impronta: { type: string }
        progressivo: { type: integer, description: Progressivo a cui si riferisce il riepilogo. }

    Consegna:
      type: object
      required: [flusso, cambiamenti, risorse]
      properties:
        flusso: { type: string }
        cambiamenti: { type: array, items: { $ref: "#/components/schemas/Cambiamento" } }
        risorse:
          type: array
          description: Stato delle risorse citate, alla versione indicata nei cambiamenti.
          items:
            oneOf:
              - $ref: "#/components/schemas/Socio"
              - $ref: "#/components/schemas/Lotto"

    EsitoConsegna:
      type: object
      required: [flusso, accettato_fino_a]
      properties:
        flusso: { type: string }
        accettato_fino_a: { type: integer }
        applicazione: { enum: [automatica, in_anteprima] }

    CursoreSuccessivo:
      type: [string, "null"]
      description: Da passare come `cursore`; `null` se non ci sono altre pagine.

    RisorsaBase:
      type: object
      required: [uuid, versione, modificato_il]
      properties:
        uuid: { type: string, format: uuid }
        versione: { type: integer, minimum: 1 }
        modificato_il: { type: string, format: date-time }

    Evento:
      allOf:
        - $ref: "#/components/schemas/RisorsaBase"
        - type: object
          required: [titolo, tipo, inizio, annullato, adesioni_aperte]
          properties:
            titolo: { type: string }
            tipo: { enum: [cerimonia, incontro, gita, conviviale, altro], description: Elenco aperto. }
            inizio: { type: string, format: date-time }
            fine: { type: [string, "null"], format: date-time }
            luogo: { type: string }
            descrizione: { type: string, description: Testo semplice. }
            quota: { type: string, description: Solo indicativa. }
            posti: { type: [integer, "null"] }
            posti_liberi: { type: [integer, "null"] }
            accompagnatori_max: { type: integer }
            adesioni_aperte: { type: boolean }
            chiusura_adesioni: { type: [string, "null"], format: date-time }
            pubblico: { type: boolean }
            annullato: { type: boolean }

    NuovaAdesione:
      type: object
      required: [cognome]
      properties:
        cognome: { type: string, maxLength: 100 }
        nome: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        telefono: { type: string, maxLength: 30 }
        accompagnatori: { type: integer, minimum: 0, default: 0 }
        note: { type: string, maxLength: 255 }
        riferimento_esterno:
          type: string
          maxLength: 100
          description: Identificativo nel sistema della controparte (per la sua riconciliazione).

    Adesione:
      allOf:
        - $ref: "#/components/schemas/RisorsaBase"
        - $ref: "#/components/schemas/NuovaAdesione"
        - type: object
          required: [evento, annullata, origine]
          properties:
            evento: { type: string, format: uuid }
            annullata: { type: boolean }
            origine: { enum: [segreteria, pubblico, area, integrazione] }
            riferimento_esterno: { type: string }

    Sezione:
      allOf:
        - $ref: "#/components/schemas/RisorsaBase"
        - type: object
          required: [codice, nome, attiva]
          properties:
            codice: { type: string }
            nome: { type: string }
            comune: { type: string }
            provincia: { type: string, maxLength: 2 }
            email: { type: string, format: email }
            attiva: { type: boolean }

    Persona:
      type: object
      required: [cognome, nome]
      properties:
        cognome: { type: string }
        nome: { type: string }
        sesso: { enum: [M, F, ""] }
        codice_fiscale: { type: string }
        data_nascita: { type: [string, "null"], format: date }
        luogo_nascita: { type: string }
        indirizzo: { type: string }
        cap: { type: string }
        comune: { type: string }
        provincia: { type: string }
        email: { type: string }
        telefono: { type: string }
        cellulare: { type: string }

    Tessera:
      type: object
      required: [anno, valida]
      properties:
        anno: { type: integer }
        carta: { type: [string, "null"], description: Codice della carta fisica (serie e numero). }
        data_rilascio: { type: [string, "null"], format: date }
        valida: { type: boolean }
        pagata: { type: boolean }
        pagata_il: { type: [string, "null"], format: date }

    Socio:
      allOf:
        - $ref: "#/components/schemas/RisorsaBase"
        - type: object
          required: [sezione, persona, tipologia, data_ammissione, stato]
          properties:
            sezione: { type: string, description: Codice della sezione. }
            matricola: { type: string, description: Matricola del registro nazionale. }
            numero_libro_origine: { type: integer, description: Numero nel libro soci di chi lo espone (non si riusa altrove). }
            persona: { $ref: "#/components/schemas/Persona" }
            tipologia: { type: string }
            data_ammissione: { type: string, format: date }
            stato: { enum: [attivo, sospeso, cessato] }
            data_cessazione: { type: [string, "null"], format: date }
            causa_cessazione: { enum: [dimissioni, decesso, esclusione, morosita, altro, ""] }
            tessere:
              type: array
              description: Anno corrente e precedente.
              items: { $ref: "#/components/schemas/Tessera" }

    Lotto:
      allOf:
        - $ref: "#/components/schemas/RisorsaBase"
        - type: object
          required: [anno, sezione, numero_da, numero_a]
          properties:
            anno: { type: integer }
            sezione: { type: string }
            serie: { type: string }
            numero_da: { type: integer }
            numero_a: { type: integer }
            cifre: { type: integer }
            data_acquisizione: { type: string, format: date }
            riferimento: { type: string }
            carte:
              type: array
              items:
                type: object
                required: [codice, stato]
                properties:
                  codice: { type: string }
                  stato: { type: string, description: Elenco aperto (disponibile, attribuita, …). }
                  socio: { type: [string, "null"], format: uuid }

    NuovaDomanda:
      type: object
      required: [cognome, nome, codice_fiscale, data_nascita, luogo_nascita, indirizzo, cap, comune,
                 provincia, accetta_statuto, consenso_trattamento]
      properties:
        sezione: { type: string, description: Codice della sezione richiesta. }
        cognome: { type: string, maxLength: 100 }
        nome: { type: string, maxLength: 100 }
        codice_fiscale: { type: string, minLength: 16, maxLength: 16 }
        data_nascita: { type: string, format: date }
        luogo_nascita: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        telefono: { type: string, maxLength: 30 }
        cellulare: { type: string, maxLength: 30 }
        indirizzo: { type: string, maxLength: 255 }
        cap: { type: string, pattern: "^[0-9]{5}$" }
        comune: { type: string, maxLength: 100 }
        provincia: { type: string, pattern: "^[A-Z]{2}$" }
        tipologia: { type: string, description: Nome della tipologia richiesta. }
        motivazione: { type: string, maxLength: 2000 }
        accetta_statuto: { const: true }
        dichiarazione: { type: [boolean, "null"] }
        consenso_trattamento: { const: true }
        consenso_particolari: { type: boolean, default: false }
        consenso_immagini: { type: boolean, default: false }
        prestato_il:
          type: string
          format: date-time
          description: Quando la persona ha prestato i consensi nel sistema della controparte.
        riferimento_esterno: { type: string, maxLength: 100 }
